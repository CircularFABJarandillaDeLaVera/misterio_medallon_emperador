<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="El misterio del medallón — Juego de misterio y deducción en Jarandilla de la Vera." />
  <title>El misterio del medallón — Juego de misterio y deducción</title>
  <link rel="stylesheet" href="/static/css/estilos.css?v=8b19" />
</head>
<body class="portada">
  <!-- FONDO DEFINITIVO PENDIENTE: esta capa queda preparada para recibir la
       ilustración cinematográfica final (azul noche / Jarandilla / medallón).
       Bastará con fijar --portada-imagen con la ruta /static/... definitiva.
       No se pinta ningún botón dentro del fondo: la interfaz es HTML real. -->
  <div class="portada-fondo" aria-hidden="true" data-fondo-definitivo="pendiente"></div>
  <div class="portada-velo" aria-hidden="true"></div>

  <main class="portada-escena">
    <header class="portada-identidad">
      <h1 class="solo-lectores">El misterio del medallón</h1>
      <figure class="portada-cartel">
        <img src="/static/img/portada/cartel.jpeg"
             alt="Cartel de El misterio del medallón: los cinco investigadores ante el Parador de Jarandilla de la Vera" />
      </figure>
    </header>

    <section class="portada-menu" aria-label="Menú principal">
      <button id="btn-nueva" class="medallon medallon-primario" type="button">
        <svg class="medallon-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7" />
          <path d="M12 7.2l1.5 2.9 3.2.5-2.3 2.2.5 3.2-2.9-1.5-2.9 1.5.5-3.2-2.3-2.2 3.2-.5z"
                fill="currentColor" opacity="0.9" />
        </svg>
        <span>NUEVA PARTIDA</span>
      </button>
      <button id="btn-unirse" class="medallon medallon-secundario" type="button">
        <svg class="medallon-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="8" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M12.5 12H21M18 12v3.2M21 12v2.2" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>UNIRSE A PARTIDA</span>
      </button>
    </section>
  </main>

  <div id="modal-nueva" class="modal portada-modal" hidden>
    <div class="modal-caja portada-modal-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-nueva">
      <h2 id="titulo-nueva">NUEVA PARTIDA</h2>
      <label class="portada-etiqueta" for="alias">TU ALIAS</label>
      <input id="alias" class="portada-campo" type="text" maxlength="20" autocomplete="off"
             placeholder="Ej. Paco" />
      <div id="envoltorio-modo" hidden>
        <label class="portada-etiqueta" for="modo">Modo de partida</label>
        <select id="modo" class="portada-campo">
          <option value="tablero" selected>MODO TABLERO</option>
          <option value="rapido">MODO RÁPIDO</option>
        </select>
      </div>
      <p class="portada-nota">LA PARTIDA REÚNE SIEMPRE 6 INVESTIGADORES.<br />PUEDE JUGAR DESDE 1 PERSONA Y COMPLETAR LAS PLAZAS RESTANTES CON PNJ.</p>
      <p id="error-nueva" class="error" role="alert"></p>
      <div class="portada-modal-acciones">
        <button id="btn-crear" class="medallon medallon-primario medallon-compacto" type="button">CREAR PARTIDA</button>
        <button id="btn-cancelar-nueva" class="medallon medallon-fantasma medallon-compacto" type="button">CANCELAR</button>
      </div>
    </div>
  </div>

  <div id="modal-unirse" class="modal portada-modal" hidden>
    <div class="modal-caja portada-modal-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-unirse">
      <h2 id="titulo-unirse">UNIRSE A PARTIDA</h2>
      <label class="portada-etiqueta" for="codigo">CÓDIGO DE SALA</label>
      <input id="codigo" class="portada-campo portada-codigo" type="text" autocomplete="off"
             placeholder="JARA-XXXX" style="text-transform: uppercase" />
      <label class="portada-etiqueta" for="alias-unirse">TU ALIAS</label>
      <input id="alias-unirse" class="portada-campo" type="text" maxlength="20" autocomplete="off"
             placeholder="Ej. Paco" />
      <p id="error" class="error" role="alert"></p>
      <div class="portada-modal-acciones">
        <button id="btn-confirmar-unirse" class="medallon medallon-primario medallon-compacto" type="button">UNIRME</button>
        <button id="btn-cancelar-unirse" class="medallon medallon-fantasma medallon-compacto" type="button">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="/static/js/inicio.js?v=8b15"></script>
  <script src="/static/js/pantalla_completa.js?v=8b19"></script>
  <!-- 8B.33B: solo la infraestructura de EFECTOS (clic). La musica
       ambiental sigue existiendo solo en la sala y no se descarga aqui:
       la pista musical se crea de forma perezosa al pedirla. -->
  <script src="/static/js/audio.js?v=8b33b"></script>
</body>
</html>
