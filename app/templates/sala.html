<!DOCTYPE html>
<html lang="es" class="preparacion-movil-inicial">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala {{ codigo }} — El Misterio del Medallón</title>
  <link rel="stylesheet" href="/static/css/estilos.css?v=chat1&amp;fondos=cinematograficos2&amp;superficies=petroleo1&amp;preparacion=movil5&amp;seleccion=movil2" />
  <script>
    /* El estado inicial ya viene en el HTML. Este bootstrap solo lo descarta
       en equipos que no son teléfonos y ofrece recuperación si sala.js no
       llega a tomar el control; no espera a la sala, al WebSocket ni al CSS. */
    (function () {
      try {
        const indicadoPorNavegador = Boolean(navigator.userAgentData && navigator.userAgentData.mobile);
        const tactil = (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;
        const punteroGrueso = Boolean(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
        const ladoCorto = Math.min(
          (window.screen && window.screen.width) || 0,
          (window.screen && window.screen.height) || 0
        );
        const esMovil =
          indicadoPorNavegador || (tactil && punteroGrueso && ladoCorto > 0 && ladoCorto <= 600);
        if (!esMovil) {
          document.documentElement.classList.remove("preparacion-movil-inicial");
          return;
        }

        const codigoSala = {{ codigo | tojson }};
        const jugadorId = sessionStorage.getItem("jugador_id") || "";
        const entradaCruda = sessionStorage.getItem("preparacion_movil_pendiente");
        if (entradaCruda) {
          const entrada = JSON.parse(entradaCruda);
          if (
            entrada.codigo === codigoSala && entrada.jugador_id === jugadorId &&
            entrada.preparacion_completada === true
          ) {
            // La escena acaba de completarse en la portada para esta entrada.
            // La señal es de un solo uso y sala.js la consumirá al arrancar.
            document.documentElement.classList.remove("preparacion-movil-inicial");
            return;
          }
        }

        let controlTransferido = false;
        let recuperacionActiva = false;
        const temporizador = window.setTimeout(function () {
          if (controlTransferido) return;
          const nota = document.getElementById("preparacion-movil-nota");
          const boton = document.getElementById("btn-entrar-pantalla-completa");
          if (!nota || !boton) return;
          nota.textContent = "La sala está tardando en responder. Puedes intentarlo de nuevo.";
          boton.textContent = "REINTENTAR CARGA";
          recuperacionActiva = true;
        }, 10000);

        document.addEventListener("click", function (evento) {
          if (!recuperacionActiva || controlTransferido) return;
          const boton = evento.target.closest && evento.target.closest("#btn-entrar-pantalla-completa");
          if (!boton) return;
          evento.preventDefault();
          window.location.reload();
        }, true);

        window.PreparacionMovilInicial = {
          tomarControl: function () {
            controlTransferido = true;
            window.clearTimeout(temporizador);
            if (recuperacionActiva) {
              const nota = document.getElementById("preparacion-movil-nota");
              const boton = document.getElementById("btn-entrar-pantalla-completa");
              if (nota) nota.textContent = "Una experiencia más inmersiva te espera.";
              if (boton) boton.textContent = "ENTRAR EN PANTALLA COMPLETA";
              recuperacionActiva = false;
            }
          }
        };
      } catch (errorDePreparacionInicial) {
        // El HTML/CSS mantiene la escena y la interfaz protegida aunque falle
        // esta mejora de detección y recuperación.
      }
    })();
  </script>
</head>
<body>
  {% include "_preparacion_movil.html" %}
  {% include "_sala_interfaz.html" %}
  <script src="/static/js/tablero_canvas.js?v=8b8b&amp;fondo=transparente1"></script>
  <script src="/static/js/audio.js?v=8b33c&amp;ciclo=2"></script>
  <script src="/static/js/sala.js?v=admin9&amp;preparacion=movil4&amp;ciclo=2"></script>
  <script src="/static/js/aprender_a_jugar.js?v=fase3b"></script>
  <script src="/static/js/pantalla_completa.js?v=8b19b&amp;preparacion=movil1&amp;continuidad=1&amp;ciclo=2"></script>
</body>
</html>
